version: '3.8'

services:
  # Only PostgreSQL for local development
  postgres:
    image: postgres:16-alpine
    container_name: ddf-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ddf_user
      POSTGRES_PASSWORD: ddf_dev_password
      POSTGRES_DB: ddf_einschlafhilfe
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddf_user -d ddf_einschlafhilfe"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
    driver: local
